services:

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    volumes:
      - db:/var/lib/mysql
    networks:
      - inception
    env_file:
      - ".env"
    restart: always

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    volumes:
      - wp:/var/www/wordpress
      - letsencrypt:/etc/letsencrypt
    networks:
      - inception
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - wordpress
    restart: always
    env_file:
      - ".env"

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    volumes:
      - wp:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always
    env_file:
      - ".env"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN_NAME}/phpmyadmin/

  redis:
    build: ./requirements/redis
    image: redis
    container_name: redis
    networks:
      - inception
    restart: always

networks:
  inception:
    name: inception

volumes:
  db:
    name: db
    driver: local
    driver_opts:
      device: /home/ubuntu/data/db
      o : bind
      type : none
  wp:
    name: wp
    driver: local
    driver_opts:
      device: /home/ubuntu/data/wp
      o : bind
      type : none
  letsencrypt:
    name: letsencrypt
